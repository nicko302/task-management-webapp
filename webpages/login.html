<!DOCTYPE html>
<html lang="en"><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="../site.css">
    <script src="../site.js"></script>
</head>

<body>
    <header>
        <hr class="headerLine">
        <nav>

			<div class="headerBar">

                <div class="headerTitleNoUser">
                    <h1 style="font-size: 30px;">☑︎ &nbsp;tAsc</h1>
                </div>

                <div class="headerUser">

                    <div class="userIcon" title="Account" onclick="toggleUserInfo()">
                        <svg width="34px" height="34px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z" fill="#ffffff"></path>
                                <path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" fill="#ffffff"></path>
                            </g>
                        </svg>
                    </div>

                    <div class="userInfo userHidden" id="user-info">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="navLogoutButton" style="margin-bottom: 20px;" id="register" href="register.html">Register</a>
                            </li>
                            <li class="nav-item">
                                <a class="navLogoutButton" id="login" href="login.html">Login</a>
                            </li>
                        </ul>
                    </div>

                </div>
                    
            </div>
              
        </nav>

    </header>

    <div class="main">
        <main role="main">
            

            <div class="login-container" style="height: 100vh;">
                <div class="login-panel">
                    <span class="login-logo">☑︎</span>
                    <h1>tAsc</h1>
                    <h3><b>Asc</b>end your workflow.</h3>
                    <form id="account" method="post" novalidate="novalidate">

                        <div>
                            <input class="login-form valid" autocomplete="username" aria-required="true" placeholder="username" type="text" data-val="true" data-val-required="The Username field is required." id="Input_UserName" name="Input.UserName" value="" aria-describedby="Input_UserName-error" aria-invalid="false">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.UserName" data-valmsg-replace="true"></span>
                        </div>
                        <div style="margin-top: 30px;">
                            <input class="login-form valid" autocomplete="current-password" aria-required="true" placeholder="password" type="password" data-val="true" data-val-required="The Password field is required." id="Input_Password" name="Input.Password" aria-describedby="Input_Password-error" aria-invalid="false">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.Password" data-valmsg-replace="true"></span>
                        </div>
                        <div style="margin-top: 30px;">
                            <label class="login-label" for="Input_RememberMe">
                                <input class="login-checkbox" type="checkbox" data-val="true" data-val-required="The Remember me? field is required." id="Input_RememberMe" name="Input.RememberMe" value="true">
                                Remember me?
                            </label>
                        </div>
                        <div>
                            <a id="login-submit" href="to-do.html" type="submit" class="login-button">Log in</a>
                        </div>
                        <div>
                            <hr style="margin-top: 50px; margin-bottom: 50px; opacity: 0.1;">
                            <p>
                                <a id="forgot-password"><u>Forgot your password?</u></a>
                            </p>
                            <p style="margin-bottom: 60px;">
                                <a href="register.html">Register as a new user</a>
                            </p>
                        </div>

                        <a href="to-do.html" style="text-decoration: none; position: absolute; top: 36.5%; right: -50%; width: 35%; height: 10vh; display: flex; justify-content: center; align-items: center; z-index: 1000; background-color: rgb(255, 255, 255, 0.07); padding: 15px; font-family: 'Poppins'; font-size: 18px; border: rgb(255, 255, 255, 0.1) solid 1px; border-radius: 30px; ">
                            <b>Click here or press "Log in" to explore the demo!</b>
                        </a>

                    </form>
                </div>
            </div>

        </main>
    </div>

</body></html>
