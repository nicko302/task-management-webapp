<!DOCTYPE html>
<html lang="en"><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../site.css">
    <script src="../site.js"></script>
</head>

<body>
    <header>
        <hr class="headerLine">

        <nav>

			<div class="headerBar">
                    <div class="headerTitleNoUser">
                        <h1 style="font-size: 30px;">☑︎ &nbsp;tAsc</h1>
                    </div>


                <div class="headerUser">
                    <div class="userIcon" title="Account" onclick="toggleUserInfo()">
                        <svg width="34px" height="34px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z" fill="#ffffff"></path>
                                <path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" fill="#ffffff"></path>
                            </g>
                        </svg>
                    </div>

                    <div class="userInfo userHidden" id="user-info">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="navLogoutButton" style="margin-bottom: 20px;" id="register" href="register.html">Register</a>
                            </li>
                            <li class="nav-item">
                                <a class="navLogoutButton" id="login" href="login.html">Login</a>
                            </li>
                        </ul>
                    </div>

                </div>
                    
            </div>
              
        </nav>

    </header>

    <div class="main">
        <main role="main">
            
            <div class="login-container">
                <div class="login-panel">
                    <form id="registerForm" method="post" action="https://localhost:7004/Identity/Account/Register" novalidate="novalidate">
                        <span class="register-logo">☑︎</span>
                        <h2>Register</h2>
            
                        <div class="login-input-container">
                            <input class="register-form" autocomplete="username" aria-required="true" placeholder="email" type="email" data-val="true" data-val-email="The Email field is not a valid e-mail address." data-val-required="The Email field is required." id="Input_Email" name="Input.Email" value="">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.Email" data-valmsg-replace="true"></span>
                        </div>
                        <div class="login-input-container">
                            <input class="register-form" autocomplete="username" aria-required="true" placeholder="username" type="text" data-val="true" data-val-required="The Username field is required." id="Input_UserName" name="Input.UserName" value="">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.UserName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="login-input-container">
                            <input class="register-form" autocomplete="new-password" aria-required="true" placeholder="password" type="password" data-val="true" data-val-length="The Password must be at least 6 and at max 100 characters long." data-val-length-max="100" data-val-length-min="6" data-val-required="The Password field is required." id="Input_Password" maxlength="100" name="Input.Password">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.Password" data-valmsg-replace="true"></span>
                        </div>
                        <div class="login-input-container">
                            <input class="register-form" autocomplete="new-password" aria-required="true" placeholder="confirm password" type="password" data-val="true" data-val-equalto="The password and confirmation password do not match." data-val-equalto-other="*.Password" id="Input_ConfirmPassword" name="Input.ConfirmPassword">
                            <span class="text-danger field-validation-valid" data-valmsg-for="Input.ConfirmPassword" data-valmsg-replace="true"></span>
                        </div>
                        <a href="to-do.html" id="registerSubmit" type="submit" class="login-button" style="margin-top: 50px !important; margin-bottom: 20px;">Register</a>

                        <hr style="margin-top: 40px; margin-bottom: 50px; opacity: 0.1;">
                        <p style="margin-bottom: 60px;">
                            <a href="login.html">Already have an account?</a>
                        </p>
                    <input name="__RequestVerificationToken" type="hidden" value="CfDJ8CZBuV_YFdtJg65vu_mUq0hXl83jC4wibo1HuqdQ9fz_XkH5cvj4X0ZFTDYzsjwE0YutjpAK2aMn9-VHjpUCfKbSt88vbcnB_p3dmd-mx6OQd9dqGtIjP-dbXMU21XxTHyUoAYVbOnw-pu4DsiEbt1Q"></form>
                </div>
            </div>


        </main>
    </div>

</body>
</html>
